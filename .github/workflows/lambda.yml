name: Lambda CI and dev deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Approve deployment of the selected main commit to dev'
        required: true
        type: boolean
        default: false

# Pull requests have no OIDC permission and cannot assume the AWS deployment role.
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: us-east-1

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for credentials
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          cd "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" git --redact --log-opts=--all
      - uses: ./.github/actions/setup-tools
      - name: Check Python response contract
        env:
          PYTHONPATH: services/lambda
        run: |
          python -m unittest discover -s services/lambda -p 'test_*.py' -v
      - name: Check Terraform and Terragrunt formatting
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infrastructure/modules
          terraform fmt -check infrastructure/bootstrap/state-backend/main.tf
          git ls-files -z -- infrastructure |
            while IFS= read -r -d '' config; do
              case "$config" in
                */.terraform.lock.hcl) continue ;;
                *.hcl) terragrunt hcl fmt --check --file "$config" ;;
              esac
            done
      - name: Validate modules and run mocked security tests
        shell: bash
        run: |
          set -euo pipefail
          for module in infrastructure/modules/lambda infrastructure/modules/github-actions infrastructure/bootstrap/state-backend; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            terraform -chdir="$module" test
          done

  dev:
    needs: checks
    # AWS additionally enforces main in the OIDC subject; PR and feature refs are rejected.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: clinical-trial-site-risk-monitor-dev-lambda
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Load private deployment identifiers
        env:
          PROJECT_AWS_ACCOUNT_ID: ${{ secrets.PROJECT_AWS_ACCOUNT_ID }}
          PROJECT_TF_STATE_BUCKET: ${{ secrets.PROJECT_TF_STATE_BUCKET }}
          PROJECT_API_GATEWAY_ID: ${{ secrets.PROJECT_API_GATEWAY_ID }}
          DEPLOY_GITHUB_OWNER_ID: ${{ github.repository_owner_id }}
          DEPLOY_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_AWS_ACCOUNT_ID"
          test -n "$PROJECT_TF_STATE_BUCKET"
          test -n "$PROJECT_API_GATEWAY_ID"
          echo "::add-mask::$PROJECT_AWS_ACCOUNT_ID"
          echo "::add-mask::$PROJECT_TF_STATE_BUCKET"
          echo "::add-mask::$PROJECT_API_GATEWAY_ID"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Recreate only the ignored deployment settings needed by Terragrunt.
          values = {
              "aws_account_id": os.environ["PROJECT_AWS_ACCOUNT_ID"],
              "state_bucket": os.environ["PROJECT_TF_STATE_BUCKET"],
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_owner_id": os.environ["DEPLOY_GITHUB_OWNER_ID"],
              "github_repository_id": os.environ["DEPLOY_GITHUB_REPOSITORY_ID"],
          }
          content = "locals {\n" + "".join(f"  {key} = {json.dumps(value)}\n" for key, value in values.items()) + "}\n"
          Path("infrastructure/live/dev/deployment.local.hcl").write_text(content)
          PY
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PROJECT_AWS_ACCOUNT_ID }}:role/clinical-trial-site-risk-monitor-dev-github-deploy
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.PROJECT_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: github-${{ github.run_id }}
      - name: Initialize and validate dev Lambda
        run: |
          terragrunt --working-dir infrastructure/live/dev/lambda init -input=false
          terragrunt --working-dir infrastructure/live/dev/lambda validate
      - name: Plan dev Lambda
        shell: bash
        run: |
          set -euo pipefail
          terragrunt --working-dir infrastructure/live/dev/lambda plan -input=false \
            -lock-timeout=60s -no-color "-out=$RUNNER_TEMP/dev-lambda.tfplan" |
            tee "$RUNNER_TEMP/dev-lambda-plan.txt"
          # Keep the plan in this runner; do not publish raw plans or state as artifacts.
          echo 'Dev plan completed. Review the masked job logs.' >> "$GITHUB_STEP_SUMMARY"
      # A push only plans. Maintainers explicitly opt into apply using Run workflow.
      - name: Apply saved plan after manual deployment approval
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        run: |
          terragrunt --working-dir infrastructure/live/dev/lambda apply -input=false "$RUNNER_TEMP/dev-lambda.tfplan"
      - name: Verify deployed Lambda response
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke --function-name clinical-trial-site-risk-monitor-dev \
            --payload '{}' "$RUNNER_TEMP/lambda-response.json" > "$RUNNER_TEMP/lambda-invoke.json"
          python -c "import json, os, pathlib; root = pathlib.Path(os.environ['RUNNER_TEMP']); metadata = json.loads((root / 'lambda-invoke.json').read_text()); assert metadata['StatusCode'] == 200 and 'FunctionError' not in metadata; response = json.loads((root / 'lambda-response.json').read_text()); assert response['statusCode'] == 200; assert json.loads(response['body'])['status'] == 'ok'; print('Deployed Lambda health response passed')"
      - name: Verify authenticated API routes
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        shell: bash
        run: |
          set -euo pipefail
          api_url=$(terragrunt --working-dir infrastructure/live/dev/lambda output -raw api_base_url)
          # Temporary OIDC credentials sign requests; no API keys or stored AWS keys are used.
          curl --fail-with-body --silent --show-error --max-time 20 \
            --aws-sigv4 'aws:amz:us-east-1:execute-api' \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            --header "X-Amz-Security-Token: $AWS_SESSION_TOKEN" \
            "$api_url/health" > "$RUNNER_TEMP/api-health.json"
          curl --fail-with-body --silent --show-error --max-time 20 \
            --aws-sigv4 'aws:amz:us-east-1:execute-api' \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            --header "X-Amz-Security-Token: $AWS_SESSION_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @docs/examples/site-assessment.json \
            "$api_url/site-assessments" > "$RUNNER_TEMP/api-assessment.json"
          unsigned_status=$(curl --silent --show-error --max-time 20 --output /dev/null \
            --write-out '%{http_code}' "$api_url/health")
          test "$unsigned_status" = '403'
          python -c "import json, os, pathlib; root = pathlib.Path(os.environ['RUNNER_TEMP']); assert json.loads((root / 'api-health.json').read_text())['status'] == 'ok'; assert json.loads((root / 'api-assessment.json').read_text())['status'] == 'validated'; print('Signed API health and submission passed; unsigned access rejected')"
