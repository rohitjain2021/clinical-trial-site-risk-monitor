name: Deploy EKS and risk service

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Apply the reviewed plans; resources remain running'
        type: boolean
        default: false
        required: true
      image_commit:
        description: 'Full previously published image commit SHA'
        type: string
        default: '817b71ca41138e6ffe07d68aeffe67ee6705c817'
        required: true

permissions:
  contents: read

concurrency:
  group: clinical-trial-site-risk-monitor-dev-demo
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_AWS_ACCOUNT_ID: ${{ secrets.PROJECT_AWS_ACCOUNT_ID }}
      PROJECT_TF_STATE_BUCKET: ${{ secrets.PROJECT_TF_STATE_BUCKET }}
      PROJECT_EKS_ADMIN_PRINCIPAL_ARN: ${{ secrets.PROJECT_EKS_ADMIN_PRINCIPAL_ARN }}
      PROJECT_EKS_ADMIN_CIDR: ${{ secrets.PROJECT_EKS_ADMIN_CIDR }}
      DEPLOY: ${{ inputs.deploy }}
      IMAGE_COMMIT: ${{ inputs.image_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Check and mask private configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in PROJECT_AWS_ACCOUNT_ID PROJECT_TF_STATE_BUCKET PROJECT_EKS_ADMIN_PRINCIPAL_ARN PROJECT_EKS_ADMIN_CIDR; do
            test -n "${!key}"
            echo "::add-mask::${!key}"
          done
      - name: Authenticate EKS deployment role using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PROJECT_AWS_ACCOUNT_ID }}:role/clinical-trial-site-risk-monitor-dev-github-demo
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.PROJECT_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
          role-session-name: eks-deploy-${{ github.run_id }}
      - name: Plan or deploy EKS and FastAPI
        run: python scripts/deploy_eks.py
      - name: Report deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "EKS deployment requested: $DEPLOY. Result: $RESULT."
            echo 'Apply provisions EKS and private FastAPI; ALB and Lambda integration remain planned.'
            echo 'Resources remain running after success or failure. No Start/Stop or automatic destruction is configured.'
          } >> "$GITHUB_STEP_SUMMARY"
